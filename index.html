(()=>{
  "use strict";
  const gameId="signal-bloom",gameName="Signal Bloom";
  posthog.register({game_id:gameId,game_name:gameName});
  let session=null;
  const language=()=>document.documentElement.lang.toLowerCase().startsWith("zh")?"zh":"en";
  const base=()=>({game_id:gameId,language:language()});
  const elapsedMs=()=>session?session.accumulatedMs+(session.runningSince===null?0:performance.now()-session.runningSince):0;
  const activeSeconds=()=>Math.max(0,Math.floor(elapsedMs()/1000));
  const pause=()=>{if(session&&session.runningSince!==null){session.accumulatedMs+=performance.now()-session.runningSince;session.runningSince=null}};
  const resume=()=>{if(session&&!session.completed&&session.runningSince===null&&!document.hidden)session.runningSince=performance.now()};
  const exit=()=>{if(!session||session.exited)return;pause();session.exited=true;posthog.capture("game_exit",{...base(),active_seconds:activeSeconds(),completed:session.completed});session=null};
  const start=(properties={})=>{if(session)exit();session={accumulatedMs:0,runningSince:document.hidden?null:performance.now(),completed:false,completionSent:false,exited:false};posthog.capture("game_start",{...base(),...properties})};
  const complete=(properties={})=>{if(!session||session.completionSent)return;pause();session.completed=true;session.completionSent=true;posthog.capture("game_complete",{...base(),active_seconds:activeSeconds(),...properties})};
  const restart=(properties={})=>{if(session)exit();posthog.capture("game_restart",base());start(properties)};
  const capture=(eventName,properties={})=>posthog.capture(eventName,{...base(),...properties});
  window.gameAnalytics={start,complete,restart,exit,pause,resume,capture,hasSession:()=>Boolean(session),activeSeconds};
  document.addEventListener("visibilitychange",()=>document.hidden?pause():resume());
  addEventListener("pagehide",exit);
  addEventListener("DOMContentLoaded",()=>posthog.capture("game_view",base()),{once:true});
})();

function showWin(){overlayState='win';gameAnalytics.capture('puzzle_complete',{difficulty:N,moves});gameAnalytics.complete({difficulty:N,score:moves,result:'solved'});updateUndoState();renderLanguage();overlay.classList.remove('hidden');tone(720,.18,'sine',.04);setTimeout(()=>tone(920,.22,'sine',.035),120)}
function celebrate(){const size=canvas.width/N;for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(Math.random()<.55)particles.push({x:(x+.5)*size,y:(y+.5)*size,vx:(Math.random()-.5)*3,vy:-1-Math.random()*3,life:40+rnd(25),h:145+rnd(55)})}
function drawConnector(cx,cy,len,angle,color,width){ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-len);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.stroke();ctx.restore()}
function roundRect(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);const bg=ctx.createRadialGradient(360,330,30,360,360,500);bg.addColorStop(0,'#10231e');bg.addColorStop(1,'#06100e');ctx.fillStyle=bg;ctx.fillRect(0,0,720,720);const s=720/N,gap=Math.max(4,s*.055),pulse=performance.now()/550;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const c=grid[y]?.[x];if(!c)continue;const px=x*s,py=y*s,cx=px+s/2,cy=py+s/2,on=c.on;ctx.fillStyle=on?'rgba(34,75,61,.72)':'rgba(16,34,29,.86)';ctx.strokeStyle=on?'rgba(94,230,168,.18)':'rgba(134,167,159,.08)';ctx.lineWidth=1;roundRect(ctx,px+gap,py+gap,s-gap*2,s-gap*2,Math.max(8,s*.13));ctx.fill();ctx.stroke();const col=on?'#5ee6a8':'#29443d',w=Math.max(7,s*.105),len=s*.40;if(c.mask&1)drawConnector(cx,cy,len,0,col,w);if(c.mask&2)drawConnector(cx,cy,len,Math.PI/2,col,w);if(c.mask&4)drawConnector(cx,cy,len,Math.PI,col,w);if(c.mask&8)drawConnector(cx,cy,len,-Math.PI/2,col,w);ctx.save();if(on){ctx.shadowBlur=14;ctx.shadowColor='#5ee6a8'}ctx.fillStyle=(x===source.x&&y===source.y)?'#facc6b':col;ctx.beginPath();ctx.arc(cx,cy,Math.max(7,s*.105)+(on?Math.sin(pulse+c.depth*.5)*1.2:0),0,Math.PI*2);ctx.fill();ctx.restore();if(x===source.x&&y===source.y){ctx.strokeStyle='rgba(250,204,107,.45)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,s*.20+Math.sin(pulse)*2,0,Math.PI*2);ctx.stroke()}}if(showAnswer&&started&&!won){
  ctx.save();
  ctx.globalAlpha=.30;
  const ss=720/N;
  for(let sy=0;sy<N;sy++)for(let sx=0;sx<N;sx++){
    const sc=grid[sy]?.[sx];if(!sc)continue;
    const sm=sc.solvedMask??sc.mask;
    const ccx=(sx+.5)*ss,ccy=(sy+.5)*ss,sl=ss*.31,sw=Math.max(3,ss*.045);
    ctx.strokeStyle='#facc6b';ctx.fillStyle='#facc6b';ctx.lineWidth=sw;ctx.lineCap='round';
    ctx.shadowBlur=6;ctx.shadowColor='#facc6b';
    const seg=(bit,dx,dy)=>{if(!(sm&bit))return;ctx.beginPath();ctx.moveTo(ccx,ccy);ctx.lineTo(ccx+dx*sl,ccy+dy*sl);ctx.stroke()};
    seg(1,0,-1);seg(2,1,0);seg(4,0,1);seg(8,-1,0);
    ctx.beginPath();ctx.arc(ccx,ccy,Math.max(2.5,ss*.035),0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}particles.forEach(p=>{ctx.fillStyle=`hsla(${p.h},85%,68%,${Math.max(0,p.life/65)})`;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.life--});particles=particles.filter(p=>p.life>0)}
function animate(){draw();requestAnimationFrame(animate)}function cellAt(e){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*canvas.width/r.width,y=(e.clientY-r.top)*canvas.height/r.height;return{x:Math.floor(x/(canvas.width/N)),y:Math.floor(y/(canvas.height/N))}}
function toggleAnswer(){if(!started||won)return;showAnswer=!showAnswer;if(showAnswer)gameAnalytics.capture('hint_used',{difficulty:N});renderAnswerLabels();tone(showAnswer?420:240,.05,'sine',.018)}
function startNewPuzzle(){gameAnalytics.hasSession()?gameAnalytics.restart({difficulty:N}):gameAnalytics.start({difficulty:N});gameAnalytics.capture('puzzle_start',{difficulty:N});overlay.classList.add('hidden');overlayState='start';generate()}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();const p=cellAt(e);if(p.x>=0&&p.y>=0&&p.x<N&&p.y<N)rotateCell(p.x,p.y,true)});canvas.addEventListener('contextmenu',e=>{e.preventDefault();const p=cellAt(e);rotateCell(p.x,p.y,false)});playBtn.addEventListener('click',startNewPuzzle);soundBtn.addEventListener('click',()=>{sound=!sound;renderLanguage()});answerBtn.addEventListener('click',toggleAnswer);mobileAnswerBtn.addEventListener('click',toggleAnswer);newGameBtn.addEventListener('click',startNewPuzzle);undoBtn.addEventListener('click',undo);document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-size]').forEach(x=>x.classList.remove('active'));b.classList.add('active');N=Number(b.dataset.size);startNewPuzzle()}));languageToggle.addEventListener('click',()=>setLanguage(language==='en'?'zh':'en'));addEventListener('keydown',e=>{if(e.code==='KeyR')startNewPuzzle();else if(e.code==='KeyZ')undo()});generate();started=false;updateUndoState();overlay.classList.remove('hidden');renderLanguage();animate();})();
</script>
